# ==============================================================================
# ⚠️ CodeQL Analysis: Временно отключен для приватного репозитория на тарифе Free
# ==============================================================================
# Причина: На приватных репозиториях GitHub Free сканирование CodeQL заблокировано
# биллингом (требуется лицензия GitHub Advanced Security / GHAS).
# При попытке запуска GitHub Actions выдаёт фатальную ошибку:
# 'Code scanning is not enabled for this repository'.
#
# Когда репозиторий будет переведён в статус PUBLIC (где CodeQL бесплатен),
# раскомментируйте код воркфлоу ниже.
# ==============================================================================

name: "CodeQL Security Scan (Disabled for Private Free Repo)"

on:
  workflow_dispatch: # Только ручной запуск, чтобы не падать на push/PR
