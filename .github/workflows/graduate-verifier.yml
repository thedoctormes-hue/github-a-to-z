name: "Graduate PR Verifier & Welcome Bot"

on:
  pull_request_target:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

jobs:
  verify-graduate:
    name: Verify Graduate Submission & Welcome
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout trusted base repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: Fetch PR commit for verification
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Run Graduate PR Verifier
        id: verifier
        run: |
          python3 scripts/verify_graduate_pr.py \
            --base origin/${{ github.base_ref }} \
            --head pr-${{ github.event.pull_request.number }} \
            --pr-author "${{ github.event.pull_request.user.login }}"

      - name: Welcome Comment & Label
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const hasGraduates = files.some(f => f.filename === 'GRADUATES.md');
            if (!hasGraduates) {
              console.log('PR does not modify GRADUATES.md. Skipping welcome comment.');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const alreadyCommented = comments.some(c => c.body.includes('Зал славы выпускников'));
            if (alreadyCommented) {
              console.log('Already commented on this PR.');
              return;
            }

            const author = context.payload.pull_request.user.login;
            const welcomeMessage = `### 🎉 Поздравляем с первым Pull Request, @${author}!\n\nВаша запись в **[Зал славы выпускников](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/GRADUATES.md)** успешно прошла автоматическую верификацию роботом-ассистентом:\n- 🛡️ **Scope Guard:** затронут только файл \`GRADUATES.md\`\n- 🔒 **Anti-Vandalism:** существующие записи выпускников сохранены в целостности\n- 📋 **Format Check:** строка таблицы оформлена строго по канону курса (6 колонок)\n- 👤 **Identity Check:** никнейм автора совпадает с логином коммита\n\nМейнтейнер проверит и запечатает ваш PR в ветку \`main\` в ближайшее время.\nДобро пожаловать в ряды официальных контрибьюторов проекта! 🚀✨`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: welcomeMessage
            });

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'graduate',
                color: 'ffd700',
                description: 'Pull Request выпускника курса в Зал славы (GRADUATES.md)'
              });
            } catch (err) {
              // Label might already exist
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['graduate']
              });
            } catch (err) {
              console.log('Notice: Could not assign label:', err.message);
            }
